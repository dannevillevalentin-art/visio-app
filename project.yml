name: Visio
options:
  bundleIdPrefix: com.vdanneville
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Visio:
    type: application
    platform: iOS
    sources:
      - path: Visio
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        PRODUCT_NAME: Visio
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
        INFOPLIST_FILE: Visio/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Visio/Info.plist
      properties:
        CFBundleDisplayName: ${APP_DISPLAY_NAME}
        CFBundleName: Visio
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: fr
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIBackgroundModes:
          - audio
          - voip
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "La caméra frontale affiche votre retour vidéo pendant l'appel ; la caméra arrière sert à filmer les vidéos."
        NSMicrophoneUsageDescription: "Le micro sert au son des vidéos filmées dans l'app et aux appels simulés."
        NSPhotoLibraryAddUsageDescription: "Pour enregistrer une copie de vos vidéos dans Photos."
