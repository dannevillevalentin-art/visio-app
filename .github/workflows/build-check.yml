name: Vérifier la compilation

# Compile l'app sans la signer, pour détecter les erreurs de code.
# Ne nécessite aucun compte Apple.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      BUNDLE_ID: com.example.visio
      APP_DISPLAY_NAME: Visio
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Générer le projet Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compiler sans signature
        run: |
          .github/scripts/xcb.sh build \
            -project Visio.xcodeproj \
            -scheme Visio \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
